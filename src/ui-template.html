function title(){return ['journeyA','journeyB'].includes(S.trip)?t(S.trip):S.trip==='all'?t('allphotos'):S.groups.find(g=>g.id===S.trip)?.name||t('newgroup')}
function renderFrame(){document.documentElement.lang=S.lang;$('demo').innerHTML=`<span class="demo-label">${t('sample')}</span><span class="hint">${t('samplehint')}</span><div class="demo-controls"><select id="sample-state" aria-label="${t('sample')}">${['gallery','expanded','empty','loading','remove'].map(v=>`<option value="${v}" ${S.view===v?'selected':''}>${t(v)}</option>`).join('')}</select><select id="language" aria-label="Language"><option value="zh" ${S.lang==='zh'?'selected':''}>中文</option><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="de" ${S.lang==='de'?'selected':''}>Deutsch</option></select><a href="docs/design-notes.html">${t('plan')}</a></div>`;
$('sidebar').innerHTML=`<div class="brand"><i class="brandmark"></i>${t('brand')}</div><div class="brand-sub">LIFE, REMEMBERED.</div>${btn(icon('grid')+t('allphotos'),'trip:all','nav '+(S.trip==='all'&&!S.onlyFavorites?'active':''))}${btn(icon('heart')+t('favorites'),'favorites','nav '+(S.onlyFavorites?'active':''))}<div class="sidebar-label">${t('journeys')}</div>${Object.entries(DEMO.covers).map(([trip,id])=>`<button class="trip ${trip===S.trip?'active':''}" data-action="trip:${trip}">${img(id)}<span><strong>${t(trip)}</strong><small>${t(trip+'date')}</small></span></button>`).join('')}${S.groups.map(g=>btn(`<span><strong>${esc(g.name)}</strong><small>${g.items.length} ${t('photos')}</small></span>`,'trip:'+g.id,'trip '+(S.trip===g.id?'active':''))).join('')}${btn('＋ '+t('newgroup'),'newgroup','add-trip')}<div class="side-bottom"><span class="stamp">m.</span>${t('sidemotto')}<br>PRIVATE LITTLE STORIES</div>`;
$('topbar').innerHTML=`<div class="breadcrumb"><span>${t('journeys')}</span><span> / </span><b>${esc(title())}</b></div><div class="top-actions">${btn(icon('download')+'<span>'+t('export')+'</span>','export','quiet-button')}<select id="identity" class="identity" aria-label="${t('identity')}"><option value="me" ${S.identity==='me'?'selected':''}>${t('asme')}</option><option value="companion" ${S.identity==='companion'?'selected':''}>${t('ascompanion')}</option></select></div>`;
$('hero').innerHTML=`<div><div class="eyebrow">${S.trip==='journeyB'?'DEMO COLLECTION B':S.trip==='journeyA'?'DEMO COLLECTION A':'A COLLECTION OF MOMENTS'}</div><h1>${esc(title())}</h1><p>${t('subtitle')}</p></div><div class="count">${String(currentGroups().reduce((n,g)=>n+g.length,0)).padStart(2,'0')}<small>${t('samplephotos')}</small></div>`;
$('toolbar').innerHTML=`<div class="tabs">${['all','people','landscape','food'].map(v=>btn(t(v),'type:'+v,'pill '+(S.type===v?'active':''))).join('')}</div><div class="view-mode">${btn(t('photosview'),'mode:photos',S.mode==='photos'?'active':'')}${btn(t('timeline'),'mode:timeline',S.mode==='timeline'?'active':'')}</div><label id="density-control" class="density-control"><span>${t('perrow')}</span><select id="density" aria-label="${t('perrow')}" aria-describedby="density-actual"><option value="auto">${t('densityauto')}</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}</option>`).join('')}</select><small id="density-actual"></small></label><label class="search">${icon('search')}<input id="search" placeholder="${t('search')}" value="${esc(S.search)}" aria-label="${t('search')}"></label><select id="sort" aria-label="${t('asc')}">${['asc','desc'].map(v=>`<option value="${v}" ${S.sort===v?'selected':''}>${t(v)}</option>`).join('')}</select>${btn(icon('sliders')+t('filter'),'filters','filter-toggle')}${btn(icon('map')+(S.showMap?t('nomap'):t('map')),'map','filter-toggle')}`;
$('filter-panel').hidden=!S.showFilters;$('filter-panel').innerHTML=`<label>${t('datefrom')} <input id="date-from" type="date" value="${S.from}"></label><span>—</span><label>${t('dateto')} <input id="date-to" type="date" value="${S.to}"></label>${btn(t('clearfilter'),'clearfilter','quiet-button')}<small style="flex-basis:100%;color:var(--muted)">${t('partialdates')}</small>`;
$('bottom-note').innerHTML=`<span>${t('samplefooter').replace('{n}',A.length)}</span><span>${t('samplefooter2')}</span>`;storageFeedback();renderLocations();renderGallery();renderBulk();renderMap();applyDensity();scheduleDensity()}
function composer(id,viewer=false){const d=draft(id),open=S.expanded.has(id);return `<div class="composer"><textarea data-photo="${id}" data-field="text" aria-label="${t('input')} · ${id}${viewer?' · '+t('fullscreen'):''}" placeholder="${t('placeholder')}">${esc(d.text||'')}</textarea><div class="composer-bottom"><span data-status="${id}" class="${d.text?'saved':''}">${t(S.identity)}${d.text?' · '+status():''}</span>${btn(t(open?'collapse':'details')+icon(open?'up':'down'),'expand:'+id)}</div></div>`}
function details(id,viewer=false){const d=draft(id),prefix=viewer?'viewer-':'';return `<div class="inline-details" data-details="${id}"><div class="details-head"><strong>${t('input')} · ${t(S.identity)}</strong><span>${t('photoonly')}</span></div><div class="field-row"><div><label for="${prefix}who-${id}">${t('who')}</label><input id="${prefix}who-${id}" data-photo="${id}" data-field="who" value="${esc(d.who||'')}" placeholder="${t('whohint')}"></div><div><label for="${prefix}when-${id}">${t('when')}</label><input id="${prefix}when-${id}" data-photo="${id}" data-field="when" value="${esc(d.when||'')}" placeholder="${t('whenhint')}"></div></div><label for="${prefix}where-${id}">${t('where')}</label><input id="${prefix}where-${id}" data-photo="${id}" data-field="where" value="${esc(d.where||'')}" placeholder="${t('wherehint')}"><label for="${prefix}little-${id}">${t('little')}</label><textarea id="${prefix}little-${id}" data-photo="${id}" data-field="little" placeholder="${t('littlehint')}">${esc(d.little||'')}</textarea><details class="evidence"><summary>${t('photoevidence')}</summary>${t('evidence')}<br><strong>${t('fulllocation')}</strong>: ${esc(fullPlace(id))}<br>${esc(byId[id].locationConfidenceText?.[S.lang]||'')}<br>${t('locationresearch')}<br>${id} · ${!byId[id].date?t('timeuncertain'):esc(byId[id].date.replaceAll(':','-').replace(/ (\d\d)-(\d\d)-(\d\d)/,' $1:$2:$3'))}</details></div>`}

function sourceNote(id){return `<div class="source-note" data-source-note="${id}"><small>${t('me')} · ${t('source')}</small><blockquote>${esc(sourceNotes[id])}</blockquote></div>`}
function card(g){let id=cover(g),stack=S.stacks.has(g[0]);return `<article class="card ${S.selected.has(g[0])?'selected':''}" data-card="${g[0]}" data-current="${id}"><div class="image-wrap"><button class="image-button" data-action="${g.length>1?'stack:'+g[0]:'viewer:'+id}" aria-label="${t(g.length>1?'members':'fullscreen')} · ${id}">${img(id)}</button><input class="select" type="checkbox" data-select="${g[0]}" ${S.selected.has(g[0])?'checked':''} aria-label="${t('select')} ${id}"><button class="favorite" data-action="favorite:${id}" aria-pressed="${S.favorites.has(id)}" aria-label="${t('favorite')} ${id}">${icon('heart')}</button>${g.length>1?btn(icon('stack')+g.length+' '+t('photos'),'stack:'+g[0],'stack'):''}<span class="image-count">${shotLabel(id)}</span></div>${stack?`<div class="member-strip">${g.map(x=>`<button class="member ${id===x?'active':''}" data-action="member:${g[0]}:${x}" aria-label="${x}" aria-pressed="${id===x}">${img(x)}</button>`).join('')}${btn(icon('image')+t('fullscreen'),'viewer:'+id,'viewlarge')}<small>${t('groupnote')}</small></div>`:''}<div class="card-meta"><h2>${photoTitle(id)}</h2><span class="date">${!byId[id].date?t('dateunknownyear'):shotDay(id).slice(5).replace('-','.')}</span></div><button class="place" data-action="place:${id}">${icon('pin')}<span>${esc(place(id))}${locationLabel(byId[id].locationArea)?`<small>${esc(locationLabel(byId[id].locationArea))}</small>`:''}</span></button>${composer(id)}${S.expanded.has(id)?details(id):''}${sourceNotes[id]?`<div class="card-footer">${btn('1 '+t('memorycount')+icon(S.notes.has(id)?'up':'down'),'notes:'+id,'history-button')}</div>${S.notes.has(id)?sourceNote(id):''}`:''}</article>`}
function renderGallery(){const el=$('gallery');if(S.view==='empty'){S.focus=null;el.innerHTML=emptyView(false);renderMap();return}if(S.view==='loading'){S.focus=null;renderMap();el.innerHTML=`<div class="loading-note"><div><strong><span class="spinner"></span>${t('preparing')}</strong><p>${t('preparingbody')}</p></div>${btn(t('showready'),'ready','quiet-button')}</div>${[1,2,3].map(()=>'<div><div class="skeleton"></div><div class="skeleton-text"></div><div class="skeleton-input"></div></div>').join('')}`;return}const items=filtered();if(!items.some(g=>g.includes(S.focus))){S.focus=items.length?cover(items[0]):null;renderMap()}if(!items.length){el.innerHTML=emptyView(!!(S.location!=='all'||S.sublocation!=='all'||S.type!=='all'||S.search||S.from||S.to||S.onlyFavorites));return}if(S.mode==='timeline'){const days=[...new Set(items.map(g=>shotDay(cover(g))))];el.innerHTML=days.map(day=>{const gs=items.filter(g=>shotDay(cover(g))===day),id=cover(gs[0]);return `<section class="timeline-item"><small>${shotLabel(id)}</small><h2>${place(id)}</h2><p>${t('timelinehint')}</p><div class="timeline-photos">${gs.slice(0,4).map(g=>btn(img(cover(g)),'jump:'+cover(g))).join('')}</div>${sourceNotes[id]?`<p style="margin-top:14px">${esc(sourceNotes[id])}</p>`:''}</section>`}).join('')}else el.innerHTML=items.map(card).join('')}
function emptyView(filtered){return `<section class="empty"><div class="empty-art"><div class="frame">${icon('image')}</div><div class="frame">${icon('plus')}</div></div><h2>${t(filtered?'noresults':'emptytitle')}</h2><p>${t(filtered?'noresultbody':'emptybody')}</p>${btn(t(filtered?'clearfilter':'showexamples'),filtered?'clearfilter':'addexamples','solid')}</section>`}
function renderBulk(){$('bulkbar').hidden=!S.selected.size;$('bulkbar').innerHTML=`<span>${t('selected')} ${S.selected.size}</span>${btn(t('addgroup'),'addgroup')}${btn(t('removegroup'),'remove')}${btn(t('cancel'),'clearselection','dim')}`}
let mapFrame=null,mapFrameKey='',mapFrameStatus='maploading';
function renderMap(){const panel=$('map-panel');panel.hidden=!S.showMap;$('content').classList.toggle('with-map',S.showMap);if(!S.showMap)return;const id=S.focus,a=byId[id];if(!a){panel.innerHTML='<h3>'+t('currentphoto')+'</h3><p>'+t('noresults')+'</p>';return}const g=a.geo,valid=g&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude)&&Math.abs(g.latitude)<=90&&Math.abs(g.longitude)<=180;const stableKey=valid?`${g.latitude},${g.longitude}`:'';if(valid&&stableKey===mapFrameKey&&mapFrame?.isConnected){panel.querySelector('h3').textContent=t('currentphoto');panel.querySelector('header+p').innerHTML=esc(place(id))+'<br>'+shotLabel(id);panel.querySelector('.map-status').textContent=t(mapFrameStatus);mapFrame.title=t('currentphoto')+' · OpenStreetMap';panel.querySelector('.map-status+p').textContent=t('mapnote');panel.querySelector('.coord').innerHTML=t('gps')+'<br>'+g.latitude.toFixed(5)+', '+g.longitude.toFixed(5);panel.querySelector('.map-note').textContent=t('locationresearch');return}if(mapFrame?.isConnected)mapFrame.remove();panel.innerHTML=`<header><h3>${t('currentphoto')}</h3><button data-action="map" aria-label="${t('nomap')}">${icon('close')}</button></header><p>${esc(place(id))}<br>${shotLabel(id)}</p><div class="map-host"></div><p class="map-status" role="status"></p><p>${valid?t('mapnote'):t('nogps')}</p><p class="coord">${valid?t('gps')+'<br>'+g.latitude.toFixed(5)+', '+g.longitude.toFixed(5):t('nogps')}</p><p class="map-note">${t('locationresearch')}</p>`;if(!valid)return;if(stableKey!==mapFrameKey){mapFrameKey=stableKey;mapFrameStatus='maploading';mapFrame=document.createElement('iframe');mapFrame.loading='eager';mapFrame.referrerPolicy='no-referrer';const lat=g.latitude,lon=g.longitude,delta=.008;mapFrame.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent([Math.max(-180,lon-delta),Math.max(-90,lat-delta),Math.min(180,lon+delta),Math.min(90,lat+delta)].join(','))+'&layer=mapnik&marker='+encodeURIComponent(lat+','+lon);const requestedFrame=mapFrame;mapFrame.addEventListener('load',()=>{if(mapFrame!==requestedFrame||!mapFrame.isConnected)return;mapFrameStatus='maploaded';const status=panel.querySelector('.map-status');if(status)status.textContent=t(mapFrameStatus)});mapFrame.addEventListener('error',()=>{if(mapFrame!==requestedFrame||!mapFrame.isConnected)return;mapFrameStatus='maperror';const status=panel.querySelector('.map-status');if(status)status.textContent=t(mapFrameStatus)})}mapFrame.title=t('currentphoto')+' · OpenStreetMap';panel.querySelector('.map-host').append(mapFrame);panel.querySelector('.map-status').textContent=t(mapFrameStatus)}

function redrawCard(id){const el=document.querySelector(`[data-current="${id}"]`);if(!el)return;const group=currentGroups().find(g=>g[0]===el.dataset.card);if(group)el.outerHTML=card(group)}
function viewerBottom(id){return `<small>${place(id)} · ${shotLabel(id)}</small><h2>${photoTitle(id)}</h2>${composer(id,true)}${S.expanded.has(id)?details(id,true):''}${sourceNotes[id]?`<details class="viewer-source"><summary>${t('viewsaved')}</summary>${sourceNote(id)}</details>`:''}`}
function openViewer(id){S.focus=id;renderMap();const v=$('viewer');v.dataset.photo=id;v.innerHTML=`${btn(icon('close'),'closeviewer','close-viewer')}${img(id)}<div class="viewer-bottom">${viewerBottom(id)}</div>`;v.showModal()}

function showDialog(kind){const d=$('dialog');if(kind==='remove'){d.innerHTML=`<div class="trash-icon">${icon('trash')}</div><h2>${t('removeq')}</h2><p>${t('selected')} ${S.selected.size}<br>${t('removebody')}</p><div class="dialog-actions">${btn(t('cancel'),'closedialog','outline')}${btn(t('confirmremove'),'confirmremove','danger')}</div>`}else{d.innerHTML=`<h2>${t('newgroup')}</h2><p>${t('addhint')}</p><input id="groupname" aria-label="${t('groupname')}" placeholder="${t('grouphint')}"><div class="dialog-actions">${btn(t('cancel'),'closedialog','outline')}${btn(t('create'),'creategroup','solid')}</div>`}d.showModal();(d.querySelector('input')||d.querySelector('[data-action="closedialog"]')).focus()}
let undo=null,toastTimer;function toast(text,revert){undo=revert;$('toast').hidden=false;$('toast').innerHTML=`<span>${esc(text)}</span>${revert?btn(t('undo'),'undo'):''}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,7000)}
function exportTrial(){const blob=new Blob([JSON.stringify({version:1,kind:'layout-trial-notes',notes:drafts},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moments-trial-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function changeView(v){S.view=v;S.mode='photos';S.type='all';S.search='';S.from='';S.to='';S.onlyFavorites=false;S.expanded.clear();if(v==='expanded'){S.trip='journeyA';S.expanded.add('D0002')}renderFrame();if(v==='remove'){S.selected=new Set([currentGroups()[0][0]]);renderBulk();showDialog('remove')}}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){setField(el.dataset.photo,el.dataset.field,el.value);return}if(el.id==='search'){S.search=el.value;renderGallery()}if(['date-from','date-to'].includes(el.id)){S[el.id==='date-from'?'from':'to']=el.value;renderGallery()}});
document.addEventListener('focusin',e=>{if(e.target.dataset.photo){S.focus=e.target.dataset.photo;if(S.showMap)renderMap()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='density'){if(S.mode!=='photos'||!validDensity(el.value))return;const view=densityView();densityPreferences[view]=el.value;applyDensity();try{localStorage.setItem(densityKeys[view],el.value)}catch{toast(t('densitytemporary'))}return}if(el.id==='language'){S.lang=el.value;renderFrame()}if(el.id==='identity'){S.identity=el.value;renderGallery()}if(el.id==='sort'){S.sort=el.value;renderGallery()}if(el.id==='sample-state')changeView(el.value);if(el.dataset.select){el.checked?S.selected.add(el.dataset.select):S.selected.delete(el.dataset.select);el.closest('.card').classList.toggle('selected',el.checked);renderBulk()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [action,x,y]=b.dataset.action.split(':');switch(action){case'locationpreview':break;case'location':S.location=x;S.sublocation='all';renderFrame();break;case'sublocation':S.sublocation=x;renderFrame();break;case'trip':S.location='all';S.sublocation='all';S.trip=x;S.view='gallery';S.mode='photos';S.type='all';S.search='';S.from='';S.to='';S.onlyFavorites=false;S.selected.clear();S.focus=currentGroups()[0]?.[0]||S.focus;renderFrame();break;case'favorites':S.location='all';S.sublocation='all';S.onlyFavorites=!S.onlyFavorites;S.trip='all';S.view='gallery';renderFrame();break;case'type':S.type=x;renderFrame();break;case'filters':S.showFilters=!S.showFilters;renderFrame();break;case'clearfilter':S.location='all';S.sublocation='all';S.type='all';S.search='';S.from='';S.to='';S.onlyFavorites=false;S.view='gallery';renderFrame();break;case'map':S.showMap=!S.showMap;renderFrame();break;case'place':S.focus=x;S.showMap=true;renderFrame();break;case'mode':S.mode=x;S.view='gallery';renderFrame();break;case'jump':S.mode='photos';renderFrame();document.querySelector(`[data-current="${x}"]`)?.scrollIntoView({block:'center',behavior:'auto'});break;case'notes':S.notes.has(x)?S.notes.delete(x):S.notes.add(x);redrawCard(x);document.querySelector('.card [data-action="notes:'+x+'"]')?.focus({preventScroll:true});if(S.notes.has(x))document.querySelector('[data-source-note="'+x+'"]')?.scrollIntoView({block:'nearest'});break;case'expand':S.expanded.has(x)?S.expanded.delete(x):S.expanded.add(x);if($('viewer').open){$('viewer').querySelector('.viewer-bottom').innerHTML=viewerBottom(x);$('viewer').querySelector('[data-action="expand:'+x+'"]')?.focus({preventScroll:true})}else{redrawCard(x);document.querySelector('.card [data-action="expand:'+x+'"]')?.focus({preventScroll:true})};break;case'stack':S.stacks.has(x)?S.stacks.delete(x):S.stacks.add(x);redrawCard(cover(currentGroups().find(g=>g[0]===x)));break;case'member':{const old=S.active[x]||x;S.active[x]=y;redrawCard(old);S.focus=y;renderMap();break}case'favorite':S.favorites.has(x)?S.favorites.delete(x):S.favorites.add(x);b.setAttribute('aria-pressed',String(S.favorites.has(x)));if(S.onlyFavorites)renderGallery();break;case'viewer':openViewer(x);break;case'closeviewer':$('viewer').close();break;case'newgroup':case'addgroup':showDialog('newgroup');break;case'creategroup':{const name=$('groupname').value.trim();if(!name){$('groupname').focus();break}const id='group-'+Date.now();S.groups.push({id,name,items:currentGroups().filter(g=>S.selected.has(g[0]))});S.selected.clear();S.trip=id;S.location='all';S.sublocation='all';S.view='gallery';$('dialog').close();renderFrame();break}case'closedialog':$('dialog').close();break;case'remove':showDialog('remove');break;case'confirmremove':{const ids=[...S.selected].map(id=>S.trip+':'+id);ids.forEach(id=>S.removed.add(id));S.selected.clear();S.view='gallery';$('dialog').close();renderFrame();toast(t('removed'),()=>{ids.forEach(id=>S.removed.delete(id));renderFrame()});break}case'undo':undo?.();$('toast').hidden=true;break;case'clearselection':S.selected.clear();renderGallery();renderBulk();break;case'export':exportTrial();break;case'addexamples':{const g=S.groups.find(g=>g.id===S.trip);if(g)g.items=groups.journeyA.slice(0,2);else S.trip='journeyA';S.view='gallery';renderFrame();break}case'ready':S.view='gallery';renderFrame();break}});
$('viewer').addEventListener('close',()=>{renderGallery();renderMap()});
window.demo={setLanguage(lang){S.lang=lang;renderFrame()},setState:changeView,getState(){return {lang:S.lang,trip:S.trip,view:S.view,identity:S.identity,drafts:structuredClone(drafts),storageState,selected:[...S.selected],focus:S.focus}}};renderFrame();
</script></body></html>
