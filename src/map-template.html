<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moments · Map</title><style>__LEAFLET_CSS__</style><style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#293f34;background:#faf9f6}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:28px}header,.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}header{justify-content:space-between}h1{font:30px Georgia,"Songti SC",serif}button,select{font:inherit;color:inherit;padding:7px 12px;border:1px solid #d5dece;background:#edf1e7;border-radius:5px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #a75d40;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:24px}#map{height:520px;border:1px solid #d5dece;border-radius:9px;z-index:0}.photo{background:#f0f2ea;border-radius:7px;overflow:hidden}.photo img{width:100%;height:auto;display:block}.photo-body{padding:16px}.photo p{color:#6b7865;font-size:12px}#stations{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.station[aria-pressed=true]{background:#456551;color:white}.marker{display:grid;place-content:center;border:2px solid #fff;border-radius:50%;background:#607d69;color:white;width:30px;height:30px;box-shadow:0 1px 5px #0003}.marker.active{background:#ab6e44}.status{font-size:12px;color:#707b67}footer{margin-top:22px;color:#7c8574;font-size:12px}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}.photo{max-width:380px}#map{height:420px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main><header><h1 id="heading"></h1><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="de">Deutsch</option></select><small id="tab-note"></small></header><div class="tools"><select id="trip" aria-label="Journey"><option value="journeyA">Demo A</option><option value="journeyB">Demo B</option></select><button id="fit"></button><button id="locate"></button><label><input id="sequence" type="checkbox"> <span id="sequence-label"></span></label></div><div class="layout"><section><div id="map" role="region" aria-label="Map"></div><p id="status" class="status" role="status"></p><div id="stations"></div></section><aside class="photo"><img id="photo" alt=""><div class="photo-body"><h2 id="photo-title"></h2><p id="photo-time"></p><p id="photo-location"></p></div></aside></div><footer id="footer"></footer></main><script>__LEAFLET_JS__</script><script>
'use strict';
const assets=__ASSETS__,config=__DEMO_CONFIG__,$=id=>document.getElementById(id);
const words={zh:{heading:'地点地图',note:'照片与回忆留在原标签页。',fit:'查看全部',locate:'定位当前',sequence:'先后顺序线（不是实际道路）',footer:'演示坐标与插图为虚构资料。地图仅展示拍摄点，不能恢复没有记录的道路。',file:'请通过本机预览服务器打开地图。',loading:'正在加载底图…',loaded:'当前视口底图已加载',error:'部分底图加载失败，可点击重试。',retry:'重试',zoomIn:'放大',zoomOut:'缩小'},en:{heading:'Places map',note:'Your photos and memories stay in the original tab.',fit:'Show all',locate:'Locate current',sequence:'Sequence line (not the actual road)',footer:'Demo coordinates and illustrations are fictional. Photo points do not reconstruct unrecorded roads.',file:'Open this map through the local preview server.',loading:'Loading map tiles…',loaded:'Tiles for this view are loaded',error:'Some tiles failed. Retry loading.',retry:'Retry',zoomIn:'Zoom in',zoomOut:'Zoom out'},de:{heading:'Ortskarte',note:'Fotos und Erinnerungen bleiben im ursprünglichen Tab.',fit:'Alle anzeigen',locate:'Aktuellen Ort zeigen',sequence:'Reihenfolge (keine gefahrene Straße)',footer:'Demokoordinaten und Illustrationen sind fiktiv. Fotopunkte rekonstruieren keine unbelegten Straßen.',file:'Diese Karte über den lokalen Vorschauserver öffnen.',loading:'Karte wird geladen…',loaded:'Kartenausschnitt geladen',error:'Einige Kacheln fehlen. Erneut laden.',retry:'Erneut laden',zoomIn:'Vergrößern',zoomOut:'Verkleinern'}};
let lang=new URLSearchParams(location.search).get('lang')||'zh';if(!words[lang])lang='zh';
let current=0,markers=[],line=null,loading='loading',failures=0,timer;
const t=k=>words[lang][k],label=x=>x?.[lang]||x?.en||x?.zh||'';
const valid=a=>a.geo&&Number.isFinite(a.geo.latitude)&&Number.isFinite(a.geo.longitude)&&Math.abs(a.geo.latitude)<=90&&Math.abs(a.geo.longitude)<=180;
const points=()=>assets.filter(a=>config.groups[$('trip').value].flat().includes(a.id)&&valid(a));
const map=L.map('map',{zoomControl:false});const zoom=L.control.zoom({zoomInTitle:t('zoomIn'),zoomOutTitle:t('zoomOut')}).addTo(map);
let tiles=null;
function status(){const p=$('status');p.replaceChildren();p.textContent=location.protocol==='file:'?t('file'):t(loading);if(loading==='error'&&tiles){const b=document.createElement('button');b.textContent=t('retry');b.onclick=()=>{failures=0;loading='loading';status();tiles.redraw();};p.append(' ',b);}}
if(location.protocol!=='file:'){
 tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
 tiles.on('loading',()=>{failures=0;loading='loading';clearTimeout(timer);timer=setTimeout(()=>{loading='error';status();},15000);status();});
 tiles.on('tileerror',()=>{failures++;loading='error';status();});tiles.on('load',()=>{clearTimeout(timer);loading=failures?'error':'loaded';status();});tiles.addTo(map);
}
function icon(i){return L.divIcon({className:'',html:'<span class="marker '+(i===current?'active':'')+'">'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]});}
function show(){const a=points()[current];if(!a)return;$('photo').src=a.dataURI;$('photo').alt=label(a.titleLabels);$('photo-title').textContent=label(a.titleLabels);$('photo-time').textContent=a.date||'';$('photo-location').textContent=label(a.locationFullLabels);markers.forEach((m,i)=>m.setIcon(icon(i)));document.querySelectorAll('.station').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));}
function drawLine(){if(line)map.removeLayer(line);line=$('sequence').checked?L.polyline(points().map(a=>[a.geo.latitude,a.geo.longitude]),{dashArray:'6 8',weight:2,color:'#9b754e',interactive:false}).addTo(map):null;}
function fit(){const rows=points();if(rows.length)map.fitBounds(rows.map(a=>[a.geo.latitude,a.geo.longitude]),{padding:[30,30],maxZoom:16});}
function draw(){markers.forEach(m=>map.removeLayer(m));const rows=points();if(current>=rows.length)current=0;markers=rows.map((a,i)=>{const m=L.marker([a.geo.latitude,a.geo.longitude],{icon:icon(i),title:label(a.titleLabels),alt:label(a.titleLabels)}).addTo(map);m.on('click',()=>{current=i;show();});return m;});$('stations').replaceChildren();rows.forEach((a,i)=>{const b=document.createElement('button');b.className='station';b.textContent=(i+1)+'. '+label(a.locationSite.labels);b.onclick=()=>{current=i;show();};$('stations').append(b);});drawLine();show();}
function translate(){document.documentElement.lang=lang;$('language').value=lang;for(const [id,key]of[['heading','heading'],['tab-note','note'],['fit','fit'],['locate','locate'],['sequence-label','sequence'],['footer','footer']])$(id).textContent=t(key);map.getContainer().querySelector('.leaflet-control-zoom-in').title=t('zoomIn');map.getContainer().querySelector('.leaflet-control-zoom-out').title=t('zoomOut');draw();status();}
$('language').onchange=e=>{lang=e.target.value;translate();};$('trip').onchange=()=>{current=0;draw();fit();};$('fit').onclick=fit;$('locate').onclick=()=>{const a=points()[current];if(a)map.panTo([a.geo.latitude,a.geo.longitude]);};$('sequence').onchange=drawLine;translate();fit();
</script></body></html>
