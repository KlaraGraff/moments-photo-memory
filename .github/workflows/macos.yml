name: macOS

on:
  pull_request:

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml
      - name: Build and test native app
        run: xcodebuild -project macos/Moments.xcodeproj -scheme Moments -destination 'platform=macOS' -derivedDataPath macos/.derivedData CODE_SIGNING_ALLOWED=NO build test
      - name: Compile native UI smoke tests
        run: xcodebuild -project macos/Moments.xcodeproj -scheme MomentsUITests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Test MomentsCore package
        run: swift test --package-path macos/MomentsCore
      - name: Run repository checks
        run: |
          python3 -m unittest discover -s tests
          for f in tests/check-*.mjs; do node "$f" || exit 1; done
          python3 tests/check-apple-host.py
          python3 tests/check-apple-bridge.py
          python3 scripts/check_privacy.py
          git diff --check
