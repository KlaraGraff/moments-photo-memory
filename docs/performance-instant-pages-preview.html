<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moments · Instant pages preview</title>
<style>
:root{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24312d;background:#f7f7f2;--line:#dfe4d9;--ink:#26342f;--muted:#78867b;--green:#456b58;--wash:#edf1e9;--danger:#9b5d49}*{box-sizing:border-box}body{margin:0}.bar{height:54px;padding:0 22px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:#fbfbf7}.brand{font:22px Georgia,serif;letter-spacing:2px}.bar small{color:var(--muted)}.bar button{border:1px solid var(--line);background:white;border-radius:6px;padding:8px 12px;margin-left:auto}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 54px)}nav{padding:22px 12px;border-right:1px solid var(--line);background:#f0f2ec}nav button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:11px 12px;color:#5f7065}nav button.active{background:#dfe9df;color:#2f5944;font-weight:600}.main{padding:24px 34px;max-width:1200px;width:100%;margin:auto}.head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}.head h1{font:36px Georgia,serif;font-weight:400;margin:7px 0 0}.status{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;padding:15px 0;border-bottom:1px solid var(--line)}.chip{border:1px solid var(--line);background:#fff;border-radius:15px;padding:7px 12px;color:#526458}.chip.active{background:#e1ece2;color:#315f47}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}.card{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.photo{height:128px;background:linear-gradient(130deg,#cad8cd,#e9eadf 48%,#c6d4cc)}.card:nth-child(2) .photo{background:linear-gradient(130deg,#d9c6ae,#f0e1cf,#a6c0b7)}.card:nth-child(3) .photo{background:linear-gradient(130deg,#aec4ce,#e6e1d2,#d1b7ae)}.meta{padding:10px}.meta b{font-size:13px}.meta small{display:block;color:var(--muted);margin-top:6px}.skeleton{height:128px;background:linear-gradient(100deg,#e6e9e1 25%,#f4f5ef 45%,#e6e9e1 65%);background-size:200% 100%;animation:sh 1.5s linear infinite}@keyframes sh{to{background-position:-200% 0}}.notice{margin-top:18px;padding:12px 14px;border:1px solid #cbdccf;border-radius:7px;background:#eef6ee;color:#4d6a55}.empty{height:300px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed #cbd5c9;border-radius:8px;margin-top:22px}.timeline{margin-top:22px}.month{font-weight:700;color:#627466;margin:20px 0 10px}.day{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.day time{width:90px;color:var(--muted)}.thumbs{display:flex;gap:8px}.thumb{width:74px;height:54px;border-radius:5px;background:#cad8cd}.map{position:relative;height:430px;margin-top:22px;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 45% 45%,#c7d9d1 0 18%,transparent 19%),linear-gradient(150deg,#dae8e4,#b9d0d0 48%,#e7e1d4)}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,#ffffff55 40px),repeating-linear-gradient(90deg,transparent 0 59px,#ffffff44 60px)}.pin{position:absolute;border:0;background:#fff;color:#315f47;border-radius:20px;padding:7px 10px;box-shadow:0 2px 7px #28483a33}.p1{left:28%;top:34%}.p2{left:56%;top:50%}.p3{left:69%;top:26%}.mapbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}.mapbar span{padding:8px 11px;border-radius:7px;background:#ffffffdd;color:#526458}.danger{max-width:420px;margin:22px auto;background:#fff;border:1px solid #ead8d0;border-radius:9px;padding:22px;box-shadow:0 12px 35px #39463c20}.danger h2{font:23px Georgia,serif;margin:0 0 9px}.danger p{line-height:1.6;color:var(--muted)}.danger .actions{text-align:right}.danger button{padding:8px 13px;border-radius:6px;border:1px solid var(--line);background:#fff;margin-left:6px}.danger .confirm{background:var(--danger);border-color:var(--danger);color:#fff}@media(max-width:800px){.layout{grid-template-columns:130px 1fr}nav{padding:15px 7px}.main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<header class="bar"><div class="brand">Moments</div><small>Instant page switching · synthetic preview</small><button onclick="cycle()">Cycle states</button></header>
<div class="layout"><nav id="nav"><button class="active" data-page="library">Library</button><button data-page="timeline">Timeline</button><button data-page="chapters">Chapters</button><button data-page="map">Map</button><button data-page="danger">Danger confirmation</button></nav><main class="main" id="main"></main></div>
<script>
const main=document.querySelector('#main'), nav=document.querySelector('#nav'); let page='library', state=1;
const card=(i,loading=false)=>`<article class="card">${loading?'<div class="skeleton"></div>':'<div class="photo"></div>'}<div class="meta"><b>${loading?'Preparing photo…':['Riverside walk','Blue hour','Morning market','Atlas view'][i%4]}</b><small>${loading?'Loading thumbnail':'2026 · synthetic demo'}</small></div></article>`;
function shell(title,sub){return `<div class="head"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div><div class="status">Shell ready · 0.3s</div></div>`}
function render(){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); if(page==='library'){let body=state===3?'<div class="empty"><div><b>No photos match this filter</b><p>Clear the filter to see your memories.</p></div></div>':state===1?'<section class="grid">'+[0,1,2,3,4,5].map((_,i)=>card(i,true)).join('')+'</section>':'<div class="notice">First batch ready · 12 of 2,400 photos · more will load as you scroll</div><section class="grid">'+[0,1,2,3,4,5,6,7].map((_,i)=>card(i,i>5)).join('')+'</section>';main.innerHTML=shell('Library','Everyday view')+'<div class="toolbar"><button class="chip active">All photos</button><button class="chip">Favourites</button><button class="chip">Places</button></div>'+body}else if(page==='timeline')main.innerHTML=shell('Timeline','Progressive days')+'<div class="toolbar"><button class="chip active">2026</button><button class="chip">All dates</button></div><div class="timeline">'+(state===3?'<div class="empty">No timeline entries</div>':'<div class="month">October 2026 · first batch</div>'+['Today','Yesterday','Monday'].map((d,i)=>'<div class="day"><time>'+d+'</time><div><b>'+['Riverside walk','Coffee and notes','Evening light'][i]+'</b><div class="thumbs"><i class="thumb"></i><i class="thumb"></i></div></div></div>').join('')+'</div><div class="notice">Scroll sentinel reached · loading the next month…</div>')+'</div>';else if(page==='chapters')main.innerHTML=shell('Chapters','Summaries first')+'<div class="notice">12 chapter cards ready · details load when opened</div><section class="grid">'+[0,1,2,3].map((_,i)=>'<article class="card"><div class="photo"></div><div class="meta"><b>Chapter '+(i+1)+'</b><small>'+ (state===2&&i===1?'Expanded · 36 photos':'12 photos · ready')+'</small></div></article>').join('')+'</section>';else if(page==='map')main.innerHTML=shell('Map','Level of detail')+'<div class="map"><div class="mapbar"><span>Globe · 120 region cap</span><span>'+ (state===1?'Loading current camera…':'Zoom to reveal detail · loading 18%')+'</span></div>'+(state===3?'':'<button class="pin p1">Morocco · 82</button><button class="pin p2">Europe · 145</button><button class="pin p3">Asia · 31</button>')+'</div><div class="notice">Zoom generation 4 cancelled; current camera remains interactive.</div>';else main.innerHTML=shell('Delete group?','Danger confirmation')+'<div class="danger"><h2>Delete “Weekend walks”?</h2><p>This removes the group and its membership rules. Photos and memories remain safe. Confirm only when you are sure.</p><div class="actions"><button>Cancel</button><button class="confirm">Delete group</button></div></div>}
nav.addEventListener('click',e=>{if(e.target.dataset.page){page=e.target.dataset.page;state=1;render()}}); function cycle(){state=(state%3)+1;render()} render();
</script>
