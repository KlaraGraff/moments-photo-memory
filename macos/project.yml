name: Moments

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: "org.example.MomentsTests"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # Apple silicon only: the owner does not ship an Intel build.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64

packages:
  MomentsCore:
    path: MomentsCore

targets:
  Moments:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sources/Moments
    dependencies:
      - package: MomentsCore
      # Linked explicitly: the large viewer plays videos with AVPlayerView.
      - sdk: AVKit.framework
    resources:
      - path: Sources/Moments/Resources/Localizable.xcstrings
      - path: Sources/Moments/Resources/InfoPlist.xcstrings
      - path: Sources/Moments/Resources/PhotosLocalizable.xcstrings
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Moments
        # Version shown in Moments › About Moments. Bump MARKETING_VERSION by
        # the rules in AGENTS.md (Releases); scripts/release_mac.sh sets the
        # build number from the commit count, so it only ever goes up.
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        # Extra keys merged into the generated Info.plist (CloudKit container,
        # share invitations). Identity and container live in Signing.xcconfig.
        INFOPLIST_FILE: Config/Moments-Info.plist
        # Entitlements and the hardened runtime only for builds signed with
        # a real team (see Signing.xcconfig): CI signs UI-test builds ad hoc,
        # and macOS refuses to launch an ad-hoc app that claims iCloud.
        CODE_SIGN_ENTITLEMENTS: $(MOMENTS_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: $(MOMENTS_HARDENED_RUNTIME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's accent (terracotta) for selection, focus and controls,
        # unless the person picked a fixed accent colour in System Settings.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Moments needs access to your photo library to import photos without copying originals."
    postBuildScripts:
      - name: Copy synthetic demo seed
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
            cp "${SRCROOT}/../demo/sample-data.json" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/sample-data.json"
          fi
    scheme:
      testTargets:
        - MomentsTests
  MomentsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MomentsTests
    dependencies:
      - target: Moments
  MomentsUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Tests/MomentsUITests
    dependencies:
      - target: Moments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.MomentsUITests

schemes:
  Moments:
    build:
      targets:
        Moments: all
        MomentsTests: [test]
    test:
      targets:
        - name: MomentsTests
  MomentsUITests:
    build:
      targets:
        Moments: all
        MomentsUITests: [test]
    test:
      targets:
        - name: MomentsUITests
