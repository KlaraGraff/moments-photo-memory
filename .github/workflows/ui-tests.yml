name: macOS UI tests

# UI tests drive the app on a hosted Mac, never on a developer's screen.
# Synthetic data only: demo seed plus generated fixture photos.
# The smoke suite runs once a pull request is ready for review (drafts skip
# it) and again on main after each merge, so changes that pass alone but
# clash together still get caught.
#
# The page probe (MomentsPageProbeUITests: a first import of a large
# synthetic library, then every page) is its own job and runs only by hand:
# Actions > macOS UI tests > Run workflow > suite "probe" (or "both"), on the
# branch to measure. It prints a summary table at the end of its log, and a
# watchdog ends it early with diagnostics when the probe stops making
# progress (scripts/page_probe_watchdog.py). Compare two runs with
# scripts/page_probe_summary.py --compare. measure_ref measures another
# branch or commit with this branch's probe, without pushing a branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'macos/Sources/**'
      - 'macos/MomentsCore/**'
      - 'macos/Tests/MomentsUITests/**'
      - 'macos/project.yml'
      - 'macos/Config/**'
      - 'demo/sample-data.json'
      - 'scripts/make_synthetic_import_fixtures.swift'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'macos/Sources/**'
      - 'macos/MomentsCore/**'
      - 'macos/Tests/MomentsUITests/**'
      - 'macos/project.yml'
      - 'macos/Config/**'
      - 'demo/sample-data.json'
      - 'scripts/make_synthetic_import_fixtures.swift'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke: the UI suite; probe: the page probe only; both'
        type: choice
        options: [smoke, probe, both]
        default: smoke
      only_testing:
        description: 'Optional, smoke suite: run only these tests, e.g. MomentsUITests/MomentsUITests/testDoubleClickRenamesATripInPlace (space-separated)'
        required: false
        default: ''
      page_stress_count:
        description: 'Page probe: photos in the synthetic library it imports'
        required: false
        default: '5000'
      measure_ref:
        description: 'Page probe, optional: measure this branch or commit instead, with the probe files of the branch you run from laid over it (it must already have the probe hooks)'
        required: false
        default: ''

# A new push to a pull request cancels that pull request's older run, so
# superseded runs never hold one of the few hosted Macs; on main only the
# newest commit is checked. Manual runs (probes, benchmarks) are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI smoke suite
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'workflow_dispatch' || inputs.suite != 'probe')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml
      - name: Generate synthetic import fixtures
        run: swift scripts/make_synthetic_import_fixtures.swift "$RUNNER_TEMP/synthetic-trip-folder"
      - name: Run UI smoke suite and import check
        env:
          TEST_RUNNER_MOMENTS_UI_IMPORT_FOLDER: ${{ runner.temp }}/synthetic-trip-folder
          TEST_RUNNER_MOMENTS_FLASH_DIR: ${{ runner.temp }}/flash
          TEST_RUNNER_MOMENTS_SCROLL_DIR: ${{ runner.temp }}/scroll
          TEST_RUNNER_MOMENTS_RESIZE_DIR: ${{ runner.temp }}/resize
          TEST_RUNNER_MOMENTS_MARQUEE_DIR: ${{ runner.temp }}/marquee
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          # A manual run can target a few tests for a quick check; pull
          # requests always run the whole suite.
          only=()
          set -f  # test IDs are words, never file globs
          for t in $ONLY_TESTING; do only+=("-only-testing:$t"); done
          # Ad-hoc signing is enough for the test runner on the hosted Mac.
          xcodebuild \
            -project macos/Moments.xcodeproj \
            -scheme MomentsUITests \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MomentsUITests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            "${only[@]}" \
            -skip-testing:MomentsUITests/MomentsPageProbeUITests \
            test
      - name: Print scroll reports
        if: always()
        run: |
          cat "$RUNNER_TEMP"/scroll/scroll-report-*.txt 2>/dev/null || echo "no scroll report"
      - name: Print marquee report
        if: always()
        run: cat "$RUNNER_TEMP"/marquee/marquee-report-*.txt 2>/dev/null || echo "no marquee report"
      - name: Print resize report
        if: always()
        run: cat "$RUNNER_TEMP"/resize/resize-report.txt 2>/dev/null || echo "no resize report"
      - name: Print flash report
        if: always()
        run: |
          dir="$RUNNER_TEMP/flash"
          [ -f "$dir/report.txt" ] || { echo "no flash report"; exit 0; }
          cat "$dir/report.txt"
          for f in "$dir"/*.png; do
            [ -f "$f" ] || continue
            out="$(mktemp -d)/shot.jpg"
            sips -Z 700 -s format jpeg -s formatOptions 60 "$f" --out "$out" >/dev/null
            echo "EVIDENCE-BEGIN $(basename "$f")"
            base64 -i "$out" | fold -w 4000
            echo "EVIDENCE-END $(basename "$f")"
          done
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ui-screenshots"
          if [ -d "$RUNNER_TEMP/MomentsUITests.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/MomentsUITests.xcresult" \
              --output-path "$RUNNER_TEMP/ui-screenshots"
          fi
      - name: Print evidence screenshots
        # Screenshots named *-evidence are printed as small base64 JPEGs so a
        # reviewer without artifact access can read them from the job log.
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/ui-screenshots" <<'PY'
          import base64, json, os, subprocess, sys, tempfile
          folder = sys.argv[1]
          manifest = os.path.join(folder, "manifest.json")
          if not os.path.exists(manifest):
              sys.exit(0)
          for test in json.load(open(manifest)):
              for item in test.get("attachments", []):
                  name = item.get("suggestedHumanReadableName", "")
                  if "evidence" not in name:
                      continue
                  source = os.path.join(folder, item["exportedFileName"])
                  out = os.path.join(tempfile.mkdtemp(), "shot.jpg")
                  subprocess.run(["sips", "-Z", "900", "-s", "format", "jpeg", "-s", "formatOptions", "60", source, "--out", out],
                                 check=True, capture_output=True)
                  print(f"EVIDENCE-BEGIN {name}")
                  data = base64.b64encode(open(out, "rb").read()).decode()
                  for start in range(0, len(data), 4000):
                      print(data[start:start + 4000])
                  print(f"EVIDENCE-END {name}")
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          retention-days: 14
      - name: Print test failures
        # Last, so the failure messages stay in the end of the job log that
        # reviewers can fetch, after the screenshots.
        if: always()
        run: |
          result="$RUNNER_TEMP/MomentsUITests.xcresult"
          [ -d "$result" ] || { echo "no result bundle"; exit 0; }
          xcrun xcresulttool get test-results summary --path "$result" --compact > "$RUNNER_TEMP/summary.json" || exit 0
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          failures = summary.get("testFailures", [])
          print(f"FAILURES-BEGIN {len(failures)}")
          for failure in failures:
              print(f"{failure.get('testIdentifierString') or failure.get('testName')}: {failure.get('failureText')}")
          print("FAILURES-END")
          PY

  page-probe:
    name: Page probe (synthetic library)
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'smoke'
    runs-on: macos-latest
    # Build about 6 minutes, probe 15 to 25 at 5,000 photos; the test itself
    # gives up after 50 minutes and the watchdog much sooner when stuck.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Lay this branch's probe over the commit to measure
        if: inputs.measure_ref != ''
        env:
          MEASURE_REF: ${{ inputs.measure_ref }}
        run: |
          probe="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$MEASURE_REF"
          git checkout --detach FETCH_HEAD
          git checkout "$probe" -- \
            macos/Sources/Moments/PageProbe.swift \
            macos/Sources/Moments/MainThreadSampler.swift \
            macos/Sources/Moments/StressLibrary.swift \
            macos/Tests/MomentsUITests/MomentsPageProbeUITests.swift \
            scripts/page_probe_watchdog.py \
            scripts/page_probe_summary.py
          echo "PROBE_FROM=$(git rev-parse --short "$probe")" >> "$GITHUB_ENV"
          echo "measuring $(git rev-parse --short HEAD) with the probe from $(git rev-parse --short "$probe")"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml
      - name: Build the app and UI tests
        run: |
          xcodebuild \
            -project macos/Moments.xcodeproj \
            -scheme MomentsUITests \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            build-for-testing
      - name: Run the page probe under the watchdog
        env:
          TEST_RUNNER_MOMENTS_PAGE_DIR: ${{ runner.temp }}/pages
          TEST_RUNNER_MOMENTS_PAGE_STRESS_COUNT: ${{ inputs.page_stress_count || '5000' }}
        run: |
          # Ends the run with diagnostics when no heartbeat appears within
          # 10 minutes, the heartbeat stops for 3, the main thread leaves a
          # ping unanswered for 4, or no phase finishes for 15. Single pages
          # still have the probe's own 45-second settle limit.
          python3 scripts/page_probe_watchdog.py \
            --page-dir "$RUNNER_TEMP/pages" \
            --diagnostics "$RUNNER_TEMP/probe-diagnostics" \
            --launch-grace 600 --stale-heartbeat 180 --main-silent 240 --no-progress 900 \
            -- \
            xcodebuild \
              -project macos/Moments.xcodeproj \
              -scheme MomentsUITests \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/PageProbe.xcresult" \
              CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
              -only-testing:MomentsUITests/MomentsPageProbeUITests/testFirstImportAndPagesWithALargeLibrary \
              test-without-building
      - name: Print the full page report
        if: always()
        run: |
          cat "$RUNNER_TEMP/pages/page-report.txt" 2>/dev/null || echo "no page report"
          if [ -f "$RUNNER_TEMP/pages/page-stuck-main.txt" ]; then
            echo "-- main thread stacks the app took while its main thread did not answer --"
            cat "$RUNNER_TEMP/pages/page-stuck-main.txt"
          fi
      - name: Upload the probe's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-probe
          path: |
            ${{ runner.temp }}/pages
            ${{ runner.temp }}/probe-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Print test failures
        if: always()
        run: |
          result="$RUNNER_TEMP/PageProbe.xcresult"
          [ -d "$result" ] || { echo "no result bundle"; exit 0; }
          xcrun xcresulttool get test-results summary --path "$result" --compact > "$RUNNER_TEMP/summary.json" || exit 0
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          failures = summary.get("testFailures", [])
          print(f"FAILURES-BEGIN {len(failures)}")
          for failure in failures:
              # The probe's failure text repeats the whole report; the
              # first lines say what went wrong.
              text = (failure.get('failureText') or '').splitlines()
              print(f"{failure.get('testIdentifierString') or failure.get('testName')}: " + "\n".join(text[:8]))
          print("FAILURES-END")
          PY
      - name: Page summary
        # Last, so the table is at the end of the log.
        if: always()
        env:
          STRESS_COUNT: ${{ inputs.page_stress_count || '5000' }}
        run: |
          report="$RUNNER_TEMP/pages/page-report.txt"
          [ -f "$report" ] || { echo "no page report"; exit 0; }
          measured="commit $(git rev-parse --short HEAD)${PROBE_FROM:+ with the probe from $PROBE_FROM}"
          echo "PAGE-SUMMARY-BEGIN $measured, $STRESS_COUNT synthetic photos"
          python3 scripts/page_probe_summary.py "$report"
          echo "PAGE-SUMMARY-END"
          {
            echo "### Page probe: $measured, $STRESS_COUNT synthetic photos"
            echo
            python3 scripts/page_probe_summary.py --markdown "$report"
          } >> "$GITHUB_STEP_SUMMARY"
